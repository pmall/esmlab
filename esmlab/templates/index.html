<!doctype html>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Mutation reports</title>
<!--
  The listing page for one model's reports. Rows link to the `<key>.html`
  pages written beside this file; the payload below is filled in by
  esmlab.mutation_render.
-->
<style>
  :root {
    color-scheme: light;
    --surface: #fcfcfb;
    --plane: #f9f9f7;
    --ink: #0b0b0b;
    --ink-2: #52514e;
    --muted: #898781;
    --grid: #e1e0d9;
    --border: rgba(11, 11, 11, 0.10);
    --link: #2a78d6;
  }
  @media (prefers-color-scheme: dark) {
    :root:not([data-theme="light"]) {
      color-scheme: dark;
      --surface: #1a1a19;
      --plane: #0d0d0d;
      --ink: #ffffff;
      --ink-2: #c3c2b7;
      --grid: #2c2c2a;
      --border: rgba(255, 255, 255, 0.10);
      --link: #3987e5;
    }
  }
  body {
    margin: 0;
    padding: 32px 24px 64px;
    background: var(--plane);
    color: var(--ink);
    font: 14px/1.5 system-ui, -apple-system, "Segoe UI", sans-serif;
  }
  main { max-width: 900px; margin: 0 auto; }
  h1 { font-size: 20px; margin: 0 0 24px; }
  section { background: var(--surface); border: 1px solid var(--border);
            border-radius: 8px; padding: 16px; }
  table { border-collapse: collapse; width: 100%; font-variant-numeric: tabular-nums; }
  th, td { padding: 6px 10px; text-align: left; }
  td.number { text-align: right; }
  thead th { color: var(--muted); font-weight: 600; border-bottom: 1px solid var(--grid); }
  tbody tr:hover { background: var(--plane); }
  a { color: var(--link); }
  code { color: var(--muted); font-size: 12px; }
  .empty { color: var(--muted); margin: 0; }
</style>

<script type="application/json" id="payload">__PAYLOAD__</script>

<main>
  <h1 id="title"></h1>
  <section><table id="entries"></table><p class="empty" id="empty" hidden>Nothing to report on.</p></section>
</main>

<script>
  const data = JSON.parse(document.getElementById("payload").textContent);

  const element = (tag, text) => {
    const node = document.createElement(tag);
    if (text !== undefined) node.textContent = text;
    return node;
  };

  const heading = data.model ? "Mutation reports - " + data.model : "Mutation reports";
  document.title = heading;
  document.getElementById("title").textContent = heading;

  const table = document.getElementById("entries");
  if (data.entries.length === 0) {
    table.hidden = true;
    document.getElementById("empty").hidden = false;
  }
  const head = document.createElement("thead");
  const headRow = document.createElement("tr");
  for (const column of ["label", "length", "computed", "key"]) {
    headRow.appendChild(element("th", column));
  }
  head.appendChild(headRow);
  table.appendChild(head);

  const body = document.createElement("tbody");
  for (const entry of data.entries) {
    const tr = document.createElement("tr");
    const link = element("a", entry.label);
    link.href = entry.key + ".html";
    tr.appendChild(element("td")).appendChild(link);
    // A windowed entry shows its coordinates rather than a bare count, so the
    // listing distinguishes a 15-residue peptide from a window of a protein.
    const length = element(
      "td", entry.start + "-" + entry.stop + " of " + entry.full_length);
    length.className = "number";
    tr.appendChild(length);
    tr.appendChild(element("td", entry.created_utc));
    tr.appendChild(element("td")).appendChild(element("code", entry.key));
    body.appendChild(tr);
  }
  table.appendChild(body);
</script>
