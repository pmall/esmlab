[project]
name = "esmlab"
version = "0.1.0"
description = "Scripts and library code for analyzing proteins with the ESM models"
readme = "README.md"
authors = [
    { name = "pmall", email = "pierre.mallinjoud@gmail.com" }
]
requires-python = ">=3.12,<3.13"
# Pinned to the commit of references/esm so the installed code matches the
# documentation read from that submodule; bump the SHA together with it.
dependencies = [
    "esm @ git+https://github.com/evolutionaryscale/esm.git@43ccece2ad485f27db46afdb67da2a9601e8f106",
    "numpy>=2.1",
    "psycopg[binary]>=3.2",
    "python-dotenv>=1.0",
    "tqdm>=4.70.0",
]

[project.optional-dependencies]
# Fused CUDA kernels for optimized GPU inference (see esmlab/connectors/local.py,
# "Fused CUDA kernels"). NOT installed on the GPU-less dev machine: enable with
# `uv sync --extra gpu` on a CUDA host, and it is baked into the Modal image.
# transformer-engine-torch compiles against the host CUDA toolkit at install
# time, so `--extra gpu` only works where nvcc is present.
gpu = [
    "flash-attn==2.7.4.post1",
    "transformer-engine[pytorch]==2.15.0",
]

[dependency-groups]
dev = [
    "modal>=0.73",
    "pytest>=8.3",
    "pyright>=1.1.390",
    "ruff>=0.8",
]

[tool.uv]
# esm hard-depends on xformers (linux/x86_64), but its only published wheel
# bundles a binary built against torch 2.10 that cannot load against esm's
# pinned torch 2.11 - and a broken-but-importable xformers still shadows
# flash-attn in esm's attention-kernel dispatch. Drop it entirely; flash-attn
# (the `gpu` extra) covers the same job. See esmlab/connectors/local.py.
override-dependencies = ["xformers; platform_system == 'no-such-system'"]

[tool.uv.sources]
# EvolutionaryScale's prebuilt flash-attn, built against esm's exact torch/CUDA
# (py312 / pytorch 2.11 / CUDA 13) for SM 8.0-9.0 (A100 through H100). Building
# flash-attn from its sdist otherwise takes 20+ min and needs the CUDA compiler.
flash-attn = { url = "https://github.com/evolutionaryscale/wheels/releases/download/py312-pt211-cu13-sm80-90/flash_attn-2.7.4.post1-cp312-cp312-linux_x86_64.whl" }

[tool.uv.build-backend]
module-root = ""

[build-system]
requires = ["uv_build>=0.12.3,<0.13.0"]
build-backend = "uv_build"

[tool.ruff]
extend-exclude = ["references"]

[tool.pyright]
include = ["esmlab", "scripts", "tests"]
exclude = ["references"]
typeCheckingMode = "standard"

[tool.pytest.ini_options]
testpaths = ["tests"]
